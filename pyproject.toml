[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kirimi-sdk"
version = "0.2.0"
description = "Official Python SDK for Kirimi WhatsApp API"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Kirimi", email = "support@kirimi.id" }]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
]
keywords = ["kirimi", "whatsapp", "api", "otp", "messaging", "indonesia"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://kirimi.id"
Documentation = "https://docs.kirimi.id"
Repository = "https://github.com/kiriminow/kirimi-python"

[tool.hatch.build.targets.wheel]
packages = ["src/kirimi"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
